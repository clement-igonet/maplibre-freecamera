<!DOCTYPE html>
<html lang="en">

<head>
    <title>Extrude polygons for 3D indoor mapping</title>
    <meta property="og:description" content="Create a 3D indoor map with the fill-extrude-height paint property." />
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel='stylesheet' href='https://unpkg.com/maplibre-gl@5.4.0/dist/maplibre-gl.css' />
    <style>
        body {
            margin: 0;
            padding: 0;
        }

        html,
        body,
        #map {
            height: 100%;
        }

    </style>
</head>

<body>
    <div id="map"></div>
    <script src="https://unpkg.com/maplibre-gl@5.4.0/dist/maplibre-gl.js"></script>
    <script type="module">
        const map = new maplibregl.Map({
            container: 'map',
            hash: true, // <-- enable hash tracking!
            style: {
                'id': 'raster',
                'version': 8,
                'projection': {
                    'type': 'globe'
                },
                'name': 'Raster tiles',
                'center': [0, 0],
                'zoom': 0,
                'sources': {
                    'raster-tiles': {
                        'type': 'raster',
                        'tiles': ['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],
                        'tileSize': 256,
                        'minzoom': 0,
                        'maxzoom': 19
                    }
                },
                'layers': [
                    {
                        'id': 'background',
                        'type': 'background',
                        'paint': {
                            'background-color': '#e0dfdf'
                        }
                    },
                    {
                        'id': 'simple-tiles',
                        'type': 'raster',
                        'source': 'raster-tiles'
                    }
                ]
            },
            center: [-87.61694, 41.86625],
            zoom: 20,
            pitch: 40,
            maxPitch: 80,
            maxZoom: 25,
            minZoom: 0,
            bearing: 20,
            canvasContextAttributes: { antialias: true }
        });

        map.on('load', () => {
            map.addSource('floorplan', {
                'type': 'geojson',
                'data': 'https://maplibre.org/maplibre-gl-js/docs/assets/indoor-3d-map.geojson'
            });
            map.addLayer({
                'id': 'room-extrusion',
                'type': 'fill-extrusion',
                'source': 'floorplan',
                'paint': {
                    'fill-extrusion-color': ['get', 'color'],
                    'fill-extrusion-height': ["/", ['get', 'height'], 10],
                    'fill-extrusion-base': ["/", ['get', 'base_height'], 10],
                    'fill-extrusion-opacity': 0.5
                }
            });


        });
    </script>
</body>

</html>
